services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-undershell}
      POSTGRES_USER: ${POSTGRES_USER:-undershell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database-data:/var/lib/postgresql/data

  game:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-undershell}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-undershell}?sslmode=disable
      SSH_MAX_CONNECTIONS: ${SSH_MAX_CONNECTIONS:-128}
      SSH_MAX_CONNECTIONS_PER_IP: ${SSH_MAX_CONNECTIONS_PER_IP:-2}
      SSH_MAX_SESSIONS: ${SSH_MAX_SESSIONS:-64}
      SSH_HANDSHAKES_PER_MINUTE_PER_IP: ${SSH_HANDSHAKES_PER_MINUTE_PER_IP:-30}
      SSH_REGISTRATIONS_PER_HOUR_PER_IP: ${SSH_REGISTRATIONS_PER_HOUR_PER_IP:-5}
    ports:
      - "22:2222"
    volumes:
      - game-data:/app/data

volumes:
  database-data:
  game-data:
